<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>自选 · 小窗看盘</title>
    <link rel="stylesheet" href="/styles.css" />
    <script type="module" src="/main.js" defer></script>
  </head>
  <body>
    <main class="app-shell">
      <header class="titlebar">
        <div class="brand" data-tauri-drag-region>
          <span class="brand-mark" aria-hidden="true">
            <img src="/analytics-graph-stock.svg" alt="" />
          </span>
          <span data-tauri-drag-region>自选看盘</span>
        </div>
        <div class="titlebar-meta">
          <span class="market-state" id="marketState" data-state="closed">收盘</span>
          <span class="auction-state" id="auctionState" hidden></span>
          <span class="beijing-clock" id="beijingTime">北京时间 --:--:--</span>
          <div class="connection" id="connection" data-state="pending">
            <span class="connection-dot"></span>
            <span id="connectionText">连接中</span>
          </div>
        </div>
        <button class="icon-button" id="hideButton" title="收进托盘" aria-label="收进托盘">−</button>
      </header>

      <section class="watch-panel" id="watchlistView">
        <div class="panel-heading"><strong>自选标的</strong></div>
        <div class="stock-list" id="stockList"></div>
        <form class="quick-add" id="addForm">
          <input id="symbolInput" inputmode="numeric" maxlength="6" placeholder="输入代码添加自选" autocomplete="off" />
          <button type="submit">加入</button>
        </form>
      </section>
    </main>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </body>
</html>
